<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>BAKSANA İşletme</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--purple:#7657e8;
--purple2:#6242d8;
--light:#f5f3fb;
--border:#e9e6f0;
--text:#191720;
--muted:#77727f;
--green:#23905a;
--red:#c84444;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--light);
color:var(--text);
}

button,
input{
font-family:inherit;
}


/* =====================
LOGIN
===================== */

.login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(
circle at top right,
#ebe4ff,
transparent 35%
),
#f8f7fc;
}

.login-box{
width:100%;
max-width:420px;
background:white;
border:1px solid var(--border);
border-radius:28px;
padding:35px 30px;
box-shadow:0 20px 60px rgba(40,20,100,.1);
}

.logo{
width:175px;
display:block;
margin:0 auto 25px;
}

.login h1{
text-align:center;
font-size:25px;
margin-bottom:8px;
}

.login p{
text-align:center;
color:var(--muted);
font-size:14px;
margin-bottom:28px;
}

.input{
margin-bottom:15px;
}

.input label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:7px;
}

.input input{
width:100%;
height:52px;
border:1px solid var(--border);
border-radius:13px;
padding:0 14px;
outline:none;
}

.input input:focus{
border-color:var(--purple);
box-shadow:0 0 0 4px #7657e815;
}

.login-btn{
width:100%;
height:53px;
border:0;
border-radius:14px;
background:linear-gradient(
135deg,
#8065ef,
#6242d8
);
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer;
margin-top:5px;
}

.error{
display:none;
background:#fff0f0;
border:1px solid #ffd5d5;
color:var(--red);
padding:11px;
border-radius:11px;
font-size:13px;
margin-bottom:15px;
text-align:center;
}


/* =====================
PANEL
===================== */

.panel{
display:none;
min-height:100vh;
}

.sidebar{
position:fixed;
left:0;
top:0;
bottom:0;
width:245px;
background:white;
border-right:1px solid var(--border);
padding:25px 15px;
}

.sidebar .logo{
width:145px;
margin:0 12px 35px;
}

.menu{
display:flex;
flex-direction:column;
gap:5px;
}

.menu button{
border:0;
background:none;
text-align:left;
padding:13px;
border-radius:13px;
font-weight:bold;
font-size:14px;
color:#625e6a;
cursor:pointer;
}

.menu button:hover,
.menu button.active{
background:#f0ebff;
color:var(--purple2);
}

.logout{
position:absolute;
bottom:25px;
left:15px;
right:15px;
}


.main{
margin-left:245px;
padding:28px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.top h1{
font-size:27px;
margin-bottom:5px;
}

.top p{
font-size:14px;
color:var(--muted);
}

.business{
background:white;
border:1px solid var(--border);
padding:8px 13px;
border-radius:14px;
display:flex;
align-items:center;
gap:10px;
font-size:13px;
font-weight:bold;
}

.avatar{
width:37px;
height:37px;
border-radius:11px;
display:grid;
place-items:center;
background:linear-gradient(
135deg,
#8065ef,
#6242d8
);
color:white;
}


/* =====================
STATS
===================== */

.stats{
display:grid;
grid-template-columns:
repeat(4,1fr);
gap:15px;
}

.stat{
background:white;
border:1px solid var(--border);
border-radius:18px;
padding:18px;
}

.stat-icon{
font-size:22px;
}

.stat-number{
font-size:27px;
font-weight:900;
margin-top:9px;
}

.stat-label{
font-size:13px;
color:var(--muted);
margin-top:4px;
}


/* =====================
CONTENT
===================== */

.content{
margin-top:20px;
background:white;
border:1px solid var(--border);
border-radius:20px;
padding:20px;
}

.content-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.content-head h2{
font-size:18px;
}

.orders{
display:flex;
flex-direction:column;
gap:10px;
}

.order{
border:1px solid var(--border);
border-radius:16px;
padding:16px;
}

.order-top{
display:flex;
justify-content:space-between;
gap:15px;
}

.order-title{
font-size:14px;
font-weight:900;
}

.order-info{
font-size:12px;
color:var(--muted);
line-height:1.7;
margin-top:5px;
}

.badge{
padding:6px 9px;
border-radius:50px;
font-size:11px;
font-weight:bold;
height:max-content;
white-space:nowrap;
background:#fff3dd;
color:#a86b00;
}

.badge.green{
background:#e7f8ee;
color:#208451;
}

.badge.red{
background:#fff0f0;
color:#c33e3e;
}

.actions{
display:flex;
gap:8px;
margin-top:13px;
}

.actions button{
border:0;
padding:9px 13px;
border-radius:10px;
font-size:12px;
font-weight:bold;
cursor:pointer;
}

.accept{
background:var(--purple);
color:white;
}

.reject{
background:#f1eef5;
color:#625e6a;
}

.complete{
background:#238b56;
color:white;
}


/* =====================
EMPTY
===================== */

.empty{
text-align:center;
padding:50px 20px;
color:var(--muted);
}

.empty-icon{
font-size:40px;
margin-bottom:10px;
}


/* =====================
PROFILE
===================== */

.profile-card{
max-width:600px;
}

.profile-row{
display:flex;
justify-content:space-between;
padding:15px 0;
border-bottom:1px solid var(--border);
font-size:14px;
}

.profile-row:last-child{
border:0;
}


/* =====================
MOBILE
===================== */

.bottom{
display:none;
}

@media(max-width:850px){

.sidebar{
display:none;
}

.main{
margin-left:0;
padding:20px 15px 90px;
}

.stats{
grid-template-columns:
repeat(2,1fr);
}

.top h1{
font-size:22px;
}

.business{
font-size:0;
}

.content{
padding:15px;
}

.bottom{
display:flex;
position:fixed;
left:0;
right:0;
bottom:0;
height:68px;
background:white;
border-top:1px solid var(--border);
z-index:10;
justify-content:space-around;
}

.bottom button{
border:0;
background:none;
font-size:11px;
color:var(--muted);
font-weight:bold;
}

.bottom button span{
display:block;
font-size:20px;
margin-bottom:3px;
}

}

</style>

</head>


<body>

LOGIN
===================================================== -->

>

<img

<p>

</div>

class="active"

</div>

<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ahvplyeunubpbtsdzldj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qF3PlPnw-g4dXeOiL-OSOw_LzKQ9kuO";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
GLOBAL
===================================================== */

let business = null;
let orders = [];


/* =====================================================
LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;


const {data,error} =
await supabaseClient.auth.signInWithPassword({
email,
password
});


if(error){

document
.getElementById("loginError")
.style.display="block";

document
.getElementById("loginError")
.innerText =
"Giriş bilgileri hatalı.";

return;

}


await loadBusiness();

}
);


/* =====================================================
OTURUM KONTROL
===================================================== */

supabaseClient.auth.onAuthStateChange(
async (event,session)=>{

if(session){

await loadBusiness();

}else{

showLogin();

}

}
);


/* =====================================================
İŞLETMEYİ YÜKLE
===================================================== */

async function loadBusiness(){

const {
data,
error
} =
await supabaseClient
.from("businesses")
.select("*")
.single();


if(error || !data){

alert(
"İşletme hesabınız sisteme tanımlanmamış."
);

await supabaseClient.auth.signOut();

return;

}


business=data;

document
.getElementById("businessName")
.innerText =
business.business_name;


document
.getElementById("loginScreen")
.style.display="none";

document
.getElementById("panel")
.style.display="block";


await loadOrders();

}


/* =====================================================
SİPARİŞLERİ YÜKLE
===================================================== */

async function loadOrders(){

if(!business){
return;
}


const {
data,
error
} =
await supabaseClient
.from("orders")
.select("*")
.eq(
"business_id",
business.id
)
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

return;

}


orders=data || [];

renderHome();

}


/* =====================================================
ANA SAYFA
===================================================== */

function renderHome(){

const pending =
orders.filter(
o =>
o.status === "Beklemede"
);


const ongoing =
orders.filter(
o =>
o.status === "Kabul Edildi" ||
o.status === "Devam Ediyor"
);


const completed =
orders.filter(
o =>
o.status === "Tamamlandı"
);


const earnings =
completed.reduce(
(sum,o)=>
sum + Number(o.price || 0),
0
);


document
.getElementById("pendingStat")
.innerText =
pending.length;


document
.getElementById("ongoingStat")
.innerText =
ongoing.length;


document
.getElementById("completedStat")
.innerText =
completed.length;


document
.getElementById("earningStat")
.innerText =
earnings.toLocaleString("tr-TR")
+
" ₺";


const container =
document
.getElementById("homeOrders");


container.innerHTML="";


if(!orders.length){

container.innerHTML=emptyHTML(
"📦",
"Henüz sipariş yok"
);

return;

}


orders
.slice(0,5)
.forEach(
order =>
container
.insertAdjacentHTML(
"beforeend",
orderHTML(order)
)
);

}


/* =====================================================
SİPARİŞ HTML
===================================================== */

function orderHTML(order){

let badge="";

if(order.status==="Tamamlandı"){

badge=
'<span class="badge green">Tamamlandı</span>';

}else if(
order.status==="Reddedildi"
){

badge=
'<span class="badge red">Reddedildi</span>';

}else{

badge=
'<span class="badge">● '
+
(order.status || "Beklemede")
+
'</span>';

}


let buttons="";


if(order.status==="Beklemede"){

buttons=`

<div class="actions">

<button
class="accept"
onclick="acceptOrder(${order.id})"
>
Kabul Et
</button>

<button
class="reject"
onclick="rejectOrder(${order.id})"
>
Reddet
</button>

</div>

`;

}


if(
order.status==="Kabul Edildi" ||
order.status==="Devam Ediyor"
){

buttons=`

<div class="actions">

<button
class="complete"
onclick="completeOrder(${order.id})"
>
İşi Tamamla ✓
</button>

</div>

`;

}


return `

<div class="order">

<div class="order-top">

<div>

<div class="order-title">

${order.service || "Hizmet"}

</div>

<div class="order-info">

Sipariş:
${order.id}

<br>

${order.block || ""}
/
${order.apartment || ""}

<br>

${order.service_date || ""}
 ·
${order.service_time || ""}

<br>

${order.customer_name || "Müşteri"}

 ·
${order.phone || ""}

<br>

${order.price
?
Number(order.price)
.toLocaleString("tr-TR")
+
" ₺"
:
"Fiyat belirtilmedi"
}

</div>

</div>

${badge}

</div>

${buttons}

</div>

`;

}


/* =====================================================
BOŞ
===================================================== */

function emptyHTML(icon,text){

return `

<div class="empty">

<div class="empty-icon">
${icon}
</div>

<div>
${text}
</div>

</div>

`;

}


/* =====================================================
SAYFA
===================================================== */

function showPage(page,button){

document
.querySelectorAll(".menu button")
.forEach(
b=>b.classList.remove("active")
);

if(button){
button.classList.add("active");
}


showPageByName(page);

}


/* =====================================================
SAYFA GÖSTER
===================================================== */

function showPageByName(page){

document
.getElementById("homePage")
.style.display =
page==="home"
?
"block"
:
"none";


document
.getElementById("dynamicPage")
.style.display =
page==="home"
?
"none"
:
"block";


if(page==="home"){

document
.getElementById("pageTitle")
.innerText =
"Hoş geldin 👋";

document
.getElementById("pageSubtitle")
.innerText =
"İşletme paneliniz";

return;

}


const titles={

orders:"📦 Siparişler",

ongoing:"🔄 Devam Edenler",

completed:"✅ Tamamlananlar",

rejected:"❌ Reddedilenler",

earnings:"💰 Kazançlar",

stats:"📊 İstatistikler",

profile:"👤 Profil"

};


document
.getElementById("pageTitle")
.innerText =
titles[page] || "BAKSANA";


document
.getElementById("pageSubtitle")
.innerText =
"İşletme yönetimi";


renderPage(page);

}


/* =====================================================
SAYFA İÇERİĞİ
===================================================== */

function renderPage(page){

const box =
document
.getElementById("dynamicContent");


if(page==="orders"){

box.innerHTML=`

<div class="content-head">
<h2>Tüm Siparişler</h2>
</div>

<div class="orders">

${
orders.length
?
orders
.map(orderHTML)
.join("")
:
emptyHTML(
"📦",
"Henüz sipariş bulunmuyor."
)
}

</div>

`;

}


else if(page==="ongoing"){

const list =
orders.filter(
o =>
o.status==="Kabul Edildi" ||
o.status==="Devam Ediyor"
);


box.innerHTML=`

<div class="content-head">
<h2>Devam Eden İşler</h2>
</div>

<div class="orders">

${
list.length
?
list.map(orderHTML).join("")
:
emptyHTML(
"🔄",
"Devam eden iş bulunmuyor."
)
}

</div>

`;

}


else if(page==="completed"){

const list =
orders.filter(
o =>
o.status==="Tamamlandı"
);


box.innerHTML=`

<div class="content-head">
<h2>Tamamlanan İşler</h2>
</div>

<div class="orders">

${
list.length
?
list.map(orderHTML).join("")
:
emptyHTML(
"✅",
"Henüz tamamlanan iş yok."
)
}

</div>

`;

}


else if(page==="rejected"){

const list =
orders.filter(
o =>
o.status==="Reddedildi"
);


box.innerHTML=`

<div class="content-head">
<h2>Reddedilen İşler</h2>
</div>

<div class="orders">

${
list.length
?
list.map(orderHTML).join("")
:
emptyHTML(
"❌",
"Reddedilen sipariş yok."
)
}

</div>

`;

}


else if(page==="earnings"){

const completed =
orders.filter(
o =>
o.status==="Tamamlandı"
);


const total =
completed.reduce(
(sum,o)=>
sum+Number(o.price||0),
0
);


box.innerHTML=`

<div class="content-head">
<h2>Kazançlar</h2>
</div>

<div class="stat">

<div class="stat-icon">
💰
</div>

<div class="stat-number">

${total.toLocaleString("tr-TR")} ₺

</div>

<div class="stat-label">
Tamamlanan siparişlerden toplam kazanç
</div>

</div>

`;

}


else if(page==="stats"){

const total=orders.length;

const completed=
orders.filter(
o=>o.status==="Tamamlandı"
).length;

const rejected=
orders.filter(
o=>o.status==="Reddedildi"
).length;

const accepted=
orders.filter(
o =>
o.status==="Kabul Edildi" ||
o.status==="Devam Ediyor" ||
o.status==="Tamamlandı"
).length;


const acceptance=
total
?
Math.round(
accepted/total*100
)
:
0;


box.innerHTML=`

<div class="content-head">
<h2>İstatistikler</h2>
</div>

<div class="stats">

<div class="stat">

<div class="stat-icon">📦</div>

<div class="stat-number">
${total}
</div>

<div class="stat-label">
Toplam Sipariş
</div>

</div>


<div class="stat">

<div class="stat-icon">✅</div>

<div class="stat-number">
${completed}

/* =====================================================
KABUL
===================================================== */

async function acceptOrder(id){

const {
error
} =
await supabaseClient
.from("orders")
.update({
status:"Kabul Edildi",
accepted_at:
new Date().toISOString()
})
.eq(
"id",
id
)
.eq(
"business_id",
business.id
);


if(error){

alert(
"Sipariş kabul edilirken hata oluştu."
);

console.error(error);

return;

}


await loadOrders();

alert(
"Sipariş kabul edildi ✓"
);

}


/* =====================================================
REDDİT
===================================================== */

async function rejectOrder(id){

const reason =
prompt(
"Red nedeni:\n\n" +
"1 - Müsait değil\n" +
"2 - Personel yetersiz\n" +
"3 - Tarih/saat uygun değil\n" +
"4 - Bölge dışında\n" +
"5 - Diğer"
);


if(!reason){
return;
}


const {
error
} =
await supabaseClient
.from("orders")
.update({

status:"Reddedildi",

rejection_reason:reason,

rejected_at:
new Date().toISOString()

})
.eq(
"id",
id
)
.eq(
"business_id",
business.id
);


if(error){

alert(
"Sipariş reddedilirken hata oluştu."
);

return;

}


await loadOrders();

alert(
"Sipariş reddedildi."
);

}


/* =====================================================
TAMAMLA
===================================================== */

async function completeOrder(id){

const {
error
} =
await supabaseClient
.from("orders")
.update({

status:"Tamamlandı",

completed_at:
new Date().toISOString()

})
.eq(
"id",
id
)
.eq(
"business_id",
business.id
);


if(error){

alert(
"Sipariş tamamlanırken hata oluştu."
);

return;

}


await loadOrders();

alert(
"İş tamamlandı ✓"
);

}

===================================================== */

function showLogin(){

document
.getElementById("panel")
.style.display="none";

document
.getElementById("loginScreen")
.style.display="flex";

}


/* =====================================================
BAŞLANGIÇ
===================================================== */

async function init(){

const {
data
} =
await supabaseClient
.auth
.getSession();


if(
data &&
data.session
){

await loadBusiness();

}else{

showLogin();

}

}


init();

</script>

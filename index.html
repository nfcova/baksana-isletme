<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7657e8">
<title>BAKSANA İşletme</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --p:#7657e8;
  --p2:#6242d8;
  --bg:#f5f3fb;
  --bd:#e9e6f0;
  --muted:#77727f;
  --green:#23905a;
  --red:#c84444
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:#191720
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}


/* LOGIN */

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(
      circle at top right,
      #ebe4ff,
      transparent 35%
    ),
    #f8f7fc
}

.login-box{
  width:min(430px,100%);
  background:#fff;
  border:1px solid var(--bd);
  border-radius:28px;
  padding:34px 30px;
  box-shadow:0 20px 60px rgba(40,20,100,.1)
}

.logo{
  width:175px;
  display:block;
  margin:0 auto 25px
}

.login h1{
  text-align:center;
  font-size:25px;
  margin-bottom:8px
}

.login p{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:28px
}

.field{
  margin-bottom:15px
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px
}

.field input{
  width:100%;
  height:52px;
  border:1px solid var(--bd);
  border-radius:13px;
  padding:0 14px;
  outline:0
}

.field input:focus{
  border-color:var(--p);
  box-shadow:0 0 0 4px #7657e815
}

.login-btn{
  width:100%;
  height:53px;
  border:0;
  border-radius:14px;
  background:
    linear-gradient(
      135deg,
      #8065ef,
      #6242d8
    );
  color:#fff;
  font-weight:700
}

.login-btn:disabled{
  opacity:.65;
  cursor:not-allowed
}

.error{
  display:none;
  background:#fff0f0;
  border:1px solid #ffd5d5;
  color:var(--red);
  padding:11px;
  border-radius:11px;
  font-size:13px;
  margin-bottom:15px;
  text-align:center
}


/* PANEL */

.panel{
  display:none;
  min-height:100vh
}

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:245px;
  background:#fff;
  border-right:1px solid var(--bd);
  padding:25px 15px;
  z-index:20
}

.sidebar .logo{
  width:145px;
  margin:0 12px 35px
}

.menu{
  display:flex;
  flex-direction:column;
  gap:5px
}

.menu button{
  border:0;
  background:transparent;
  text-align:left;
  padding:13px;
  border-radius:13px;
  font-weight:700;
  font-size:14px;
  color:#625e6a
}

.menu button:hover,
.menu button.active{
  background:#f0ebff;
  color:var(--p2)
}

.logout{
  position:absolute;
  left:15px;
  right:15px;
  bottom:25px
}

.main{
  margin-left:245px;
  padding:28px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px
}

.top h1{
  font-size:27px;
  margin-bottom:5px
}

.top p{
  font-size:14px;
  color:var(--muted)
}

.business{
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff;
  border:1px solid var(--bd);
  padding:8px 13px;
  border-radius:14px;
  font-size:13px;
  font-weight:700
}

.avatar{
  width:37px;
  height:37px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(
      135deg,
      #8065ef,
      #6242d8
    );
  color:#fff
}


/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px
}

.stat{
  background:#fff;
  border:1px solid var(--bd);
  border-radius:18px;
  padding:18px
}

.stat-icon{
  font-size:22px
}

.stat-number{
  font-size:27px;
  font-weight:900;
  margin-top:9px
}

.stat-label{
  font-size:13px;
  color:var(--muted);
  margin-top:4px
}


/* CONTENT */

.content{
  margin-top:20px;
  background:#fff;
  border:1px solid var(--bd);
  border-radius:20px;
  padding:20px
}

.content-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px
}

.content-head h2{
  font-size:18px
}

.orders{
  display:flex;
  flex-direction:column;
  gap:10px
}

.order{
  border:1px solid var(--bd);
  border-radius:16px;
  padding:16px
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:15px
}

.order-title{
  font-size:14px;
  font-weight:900
}

.order-info{
  font-size:12px;
  color:var(--muted);
  line-height:1.8;
  margin-top:7px
}

.order-note{
  margin-top:10px;
  background:#faf9fd;
  border:1px solid var(--bd);
  padding:10px 12px;
  border-radius:11px;
  font-size:12px;
  line-height:1.6
}

.order-price{
  margin-top:9px;
  font-size:16px;
  font-weight:900
}

.site-tag{
  display:inline-block;
  margin-top:8px;
  padding:5px 8px;
  border-radius:8px;
  background:#f3efff;
  color:#5b3ec9;
  font-size:11px;
  font-weight:700
}

.badge{
  padding:6px 9px;
  border-radius:50px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  background:#fff3dd;
  color:#a86b00;
  height:max-content
}

.badge.green{
  background:#e7f8ee;
  color:#208451
}

.badge.red{
  background:#fff0f0;
  color:#c33e3e
}

.badge.blue{
  background:#edf4ff;
  color:#2f62bd
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:13px
}

.actions button,
.refresh{
  border:0;
  padding:9px 13px;
  border-radius:10px;
  font-size:12px;
  font-weight:700
}

.accept{
  background:var(--p);
  color:#fff
}

.reject{
  background:#f1eef5;
  color:#625e6a
}

.complete{
  background:#238b56;
  color:#fff
}

.refresh{
  background:#fff;
  color:#4f4a57;
  border:1px solid var(--bd)
}


/* EMPTY */

.empty{
  text-align:center;
  padding:50px 20px;
  color:var(--muted)
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px
}


/* PROFILE */

.profile{
  max-width:650px
}

.profile-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:15px 0;
  border-bottom:1px solid var(--bd);
  font-size:14px
}

.profile-row:last-child{
  border:0
}

.profile-row b{
  text-align:right;
  word-break:break-word
}


/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#100c1e73;
  z-index:500;
  place-items:center;
  padding:20px
}

.modal.show{
  display:grid
}

.modal-box{
  width:min(430px,100%);
  background:#fff;
  border-radius:20px;
  padding:20px
}

.modal-box h3{
  margin-bottom:6px
}

.modal-box p{
  font-size:13px;
  color:var(--muted);
  margin-bottom:15px
}

.modal-box select{
  width:100%;
  height:48px;
  border:1px solid var(--bd);
  border-radius:11px;
  padding:0 10px
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:16px
}

.modal-actions button{
  flex:1;
  border:0;
  border-radius:11px;
  padding:12px;
  font-weight:700
}

.modal-cancel{
  background:#f1eef5;
  color:#5e5966
}

.modal-confirm{
  background:var(--red);
  color:#fff
}


/* TOAST */

.toast{
  position:fixed;
  right:24px;
  bottom:24px;
  z-index:1000;
  padding:13px 16px;
  border-radius:13px;
  background:#191720;
  color:#fff;
  opacity:0;
  transform:translateY(15px);
  pointer-events:none;
  transition:.2s;
  font-size:13px
}

.toast.show{
  opacity:1;
  transform:none
}

.toast.error{
  background:#a72f2f
}

.toast.success{
  background:#1f7b50
}


/* MOBILE */

.bottom{
  display:none
}

@media(max-width:850px){

  .sidebar{
    display:none
  }

  .main{
    margin-left:0;
    padding:20px 15px 90px
  }

  .stats{
    grid-template-columns:repeat(2,1fr)
  }

  .top h1{
    font-size:22px
  }

  .business{
    font-size:0
  }

  .bottom{
    display:flex;
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    background:#fff;
    border-top:1px solid var(--bd);
    z-index:100;
    justify-content:space-around
  }

  .bottom button{
    border:0;
    background:none;
    font-size:11px;
    color:var(--muted);
    font-weight:700;
    padding:5px 10px
  }

  .bottom button span{
    display:block;
    font-size:20px;
    margin-bottom:3px
  }
}

@media(max-width:520px){

  .top{
    align-items:flex-start
  }

  .top h1{
    font-size:20px
  }

  .profile-row{
    flex-direction:column;
    gap:6px
  }

  .profile-row b{
    text-align:left
  }

  .login-box{
    padding:28px 20px
  }

  .toast{
    left:15px;
    right:15px;
    bottom:82px
  }
}
</style>
</head>

<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ahvplyeunubpbtsdzldj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qF3PlPnw-g4dXeOiL-OSOw_LzKQ9kuO";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
GLOBAL
===================================================== */

let session = null;

let business = null;

let orders = [];

let rejectId = null;

let poll = null;

let channel = null;


/* =====================================================
PAGE TITLES
===================================================== */

const titles = {

home:[
"Hoş geldin 👋",
"İşletme paneliniz"
],

orders:[
"📦 Siparişler",
"Tüm işletme siparişleri"
],

ongoing:[
"🔄 Devam Edenler",
"Kabul edilen ve devam eden işler"
],

completed:[
"✅ Tamamlananlar",
"Tamamlanan işler ve geçmiş"
],

rejected:[
"❌ Reddedilenler",
"Reddedilmiş siparişler"
],

earnings:[
"💰 Kazançlar",
"Tamamlanan siparişlerden kazanç"
],

stats:[
"📊 İstatistikler",
"İşletme performansı"
],

profile:[
"👤 Profil",
"İşletme bilgileri"
]

};


/* =====================================================
HTML ESCAPE
===================================================== */

function esc(value){

return String(
value ?? ""
)

.replace(
/[&<>"']/g,
m =>
({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}


/* =====================================================
PARA
===================================================== */

function money(value){

return Number(
value || 0
)
.toLocaleString(
"tr-TR"
)
+
" ₺";

}


/* =====================================================
TARİH
===================================================== */

function dateTR(value){

if(!value)
return "-";

try{

return new Intl.DateTimeFormat(
"tr-TR",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
)
.format(
new Date(value)
);

}

catch{

return String(
value
);

}

}


/* =====================================================
TOAST
===================================================== */

function toast(
message,
type="success"
){

const x =
document.getElementById(
"toast"
);

x.textContent =
message;

x.className =
"toast show " +
type;

clearTimeout(
toast.timer
);

toast.timer =
setTimeout(
()=>{
x.className="toast";
},
3000
);

}


/* =====================================================
LOGIN SCREEN
===================================================== */

function showLogin(){

document
.getElementById(
"panel"
)
.style
.display="none";


document
.getElementById(
"loginScreen"
)
.style
.display="grid";


if(channel){

supabaseClient
.removeChannel(
channel
);

channel=null;

}


clearInterval(
poll
);

poll=null;

business=null;

orders=[];

}


/* =====================================================
PANEL
===================================================== */

function showPanel(){

document
.getElementById(
"loginScreen"
)
.style
.display="none";


document
.getElementById(
"panel"
)
.style
.display="block";

}


/* =====================================================
GİRİŞ
===================================================== */

async function loginBusiness(){

const email =
document
.getElementById(
"email"
)
.value
.trim();


const password =
document
.getElementById(
"password"
)
.value;


const errorBox =
document
.getElementById(
"loginError"
);


const button =
document
.getElementById(
"loginButton"
);


errorBox.style.display =
"none";


if(
!email ||
!password
){

errorBox.textContent =
"E-posta ve şifreyi gir.";

errorBox.style.display =
"block";

return;

}


button.disabled=true;

button.textContent =
"GİRİŞ YAPILIYOR...";


const {
data,
error
} =
await supabaseClient
.auth
.signInWithPassword({
email:email,
password:password
});


button.disabled=false;

button.textContent =
"GİRİŞ YAP";


if(error){

console.error(
"SUPABASE LOGIN ERROR:",
error
);

errorBox.textContent =
"Giriş hatası: " +
error.message;

errorBox.style.display =
"block";

return;

}


if(
!data ||
!data.session
){

errorBox.textContent =
"Oturum oluşturulamadı.";

errorBox.style.display =
"block";

return;

}


session =
data.session;


await loadBusiness();

}


/* =====================================================
İŞLETMEYİ BUL
===================================================== */

async function loadBusiness(){

try{

const {
data
} =
await supabaseClient
.auth
.getSession();


session =
data.session;


if(!session){

showLogin();

return;

}


/* PROFILE */

const {
data:profile,
error:profileError
} =
await supabaseClient
.from(
"profiles"
)
.select(
"id,role,business_id,full_name"
)
.eq(
"id",
session.user.id
)
.maybeSingle();


if(profileError){

throw profileError;

}


if(
!profile ||
profile.role !== "business" ||
!profile.business_id
){

document
.getElementById(
"loginError"
)
.textContent =
"Bu hesap bir işletme hesabına bağlı değil.";

document
.getElementById(
"loginError"
)
.style.display =
"block";

await supabaseClient
.auth
.signOut();

return;

}


/* BUSINESS */

const {
data:businessData,
error:businessError
} =
await supabaseClient
.from(
"businesses"
)
.select(
"id,name,phone,email,category,active,created_at"
)
.eq(
"id",
profile.business_id
)
.maybeSingle();


if(businessError){

throw businessError;

}


if(
!businessData ||
!businessData.active
){

document
.getElementById(
"loginError"
)
.textContent =
"İşletme hesabı aktif değil.";

document
.getElementById(
"loginError"
)
.style.display =
"block";

await supabaseClient
.auth
.signOut();

return;

}


business =
businessData;


document
.getElementById(
"businessName"
)
.textContent =
business.name;


showPanel();


showPageByName(
"home"
);


await loadOrders();


setupRealtime();


clearInterval(
poll
);


poll =
setInterval(
()=>{
loadOrders(false);
},
20000
);

}

catch(error){

console.error(
"LOAD BUSINESS ERROR:",
error
);

document
.getElementById(
"loginError"
)
.textContent =
"Sistem hatası: " +
(error.message ||
"Bilinmeyen hata");

document
.getElementById(
"loginError"
)
.style.display =
"block";

showLogin();

}

}


/* =====================================================
SİPARİŞLER
===================================================== */

async function loadOrders(
notify
){

if(!business)
return;


let result =
await supabaseClient
.from(
"orders"
)
.select(`
id,
service,
customer_name,
phone,
block,
apartment,
service_date,
service_time,
details,
note,
status,
created_at,
site_id,
business_id,
order_code,
price,
rejection_reason,
accepted_at,
rejected_at,
completed_at,
sites(name,slug)
`)
.eq(
"business_id",
business.id
)
.order(
"created_at",
{
ascending:false
}
);


if(result.error){

console.error(
result.error
);


/*
Fallback
*/

const fallback =
await supabaseClient
.from(
"orders"
)
.select("*")
.eq(
"business_id",
business.id
)
.order(
"created_at",
{
ascending:false
}
);


if(fallback.error){

toast(
"Siparişler yüklenemedi: " +
fallback.error.message,
"error"
);

return;

}


orders =
fallback.data ||
[];

}

else{

orders =
result.data ||
[];

}


renderHome();


const activePage =
document
.querySelector(
".menu button.active"
)
?.dataset.page;


if(
activePage &&
activePage !== "home"
){

renderPage(
activePage
);

}


if(notify){

toast(
"Siparişler güncellendi"
);

}

}


/* =====================================================
REALTIME
===================================================== */

function setupRealtime(){

if(channel){

supabaseClient
.removeChannel(
channel
);

}


channel =
supabaseClient
.channel(
"business-orders-" +
business.id
)
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"orders",
filter:
"business_id=eq." +
business.id
},
()=>{

loadOrders(
false
);

}
)
.subscribe();

}

/* =====================================================
HOME
===================================================== */

function renderHome(){

const pending =
orders.filter(
o =>
o.status ===
"Beklemede"
).length;


const ongoing =
orders.filter(
o =>
[
"Kabul Edildi",
"Devam Ediyor"
].includes(
o.status
)
).length;


const completed =
orders.filter(
o =>
o.status ===
"Tamamlandı"
);


const total =
completed.reduce(
(
sum,
o
)=>
sum +
Number(
o.price ||
0
),
0
);


document
.getElementById(
"pendingStat"
)
.textContent =
pending;


document
.getElementById(
"ongoingStat"
)
.textContent =
ongoing;


document
.getElementById(
"completedStat"
)
.textContent =
completed.length;


document
.getElementById(
"earningStat"
)
.textContent =
money(
total
);


document
.getElementById(
"homeOrders"
)
.innerHTML =
orders.length
?
orders
.slice(
0,
5
)
.map(
orderHTML
)
.join("")
:
empty(
"📦",
"Henüz size atanmış sipariş yok."
);

}

page,
button

document

)

===================================================== */

function showPageByName(
page
){

document
.querySelectorAll(
".menu button[data-page]"
)
.forEach(
x =>

"active",
x.dataset.page === page
)
);

.querySelectorAll(
".bottom button"
)
.forEach(
x =>
x.style.color =
x.dataset.page === page
?
"#6242d8"

"#77727f"
);


document
.getElementById(
"homePage"
)
.style
.display =
page === "home"
?
"block"
:
"none";


document
.getElementById(
"dynamicPage"
)
.style
.display =
page === "home"
?
"none"
:
"block";


document
.getElementById(
"pageTitle"
)
.textContent =
titles[page]?.[0] ||
"BAKSANA";

.getElementById(
"pageSubtitle"
)
.textContent =
titles[page]?.[1] ||
"İşletme yönetimi";

"home"

page

/* =====================================================
KABUL ET
===================================================== */

async function acceptOrder(
id
){

const {
error
} =
await supabaseClient
.from(
"orders"
)
.update({

status:
"Kabul Edildi",

accepted_at:
new Date()
.toISOString()

})
.eq(
"id",
id
)
.eq(
"business_id",
business.id
);


if(error){

toast(
"Sipariş kabul edilemedi: " +
error.message,
"error"
);

return;

}


await loadOrders(
false
);


toast(
"Sipariş kabul edildi ✓"
);

}


/* =====================================================
RED MODAL
===================================================== */

function openReject(
id
){

rejectId =
id;


document
.getElementById(
"rejectReason"
)
.value =
"";


document
.getElementById(
"rejectModal"
)
.classList
.add(
"show"
);

}


function closeRejectModal(){

rejectId =
null;


document
.getElementById(
"rejectModal"
)
.classList
.remove(
"show"
);

}


/* =====================================================
REDDET
===================================================== */

async function confirmReject(){

if(
!rejectId
)
return;


const reason =
document
.getElementById(
"rejectReason"
)
.value;


if(
!reason
){

toast(
"Red nedeni seç.",
"error"
);

return;

}


const {
error
} =
await supabaseClient
.from(
"orders"
)
.update({

status:
"Reddedildi",

rejection_reason:
reason,

rejected_at:
new Date()
.toISOString()

})
.eq(
"id",
rejectId
)
.eq(
"business_id",
business.id
);


if(error){

toast(
"Sipariş reddedilemedi: " +
error.message,
"error"
);

return;

}


closeRejectModal();


await loadOrders(
false
);


toast(
"Sipariş reddedildi"
);

}


/* =====================================================
TAMAMLA
===================================================== */

async function completeOrder(
id
){

const {
error
} =
await supabaseClient
.from(
"orders"
)
.update({

status:
"Tamamlandı",

completed_at:
new Date()
.toISOString()

})
.eq(
"id",
id
)
.eq(
"business_id",
business.id
);


if(error){

toast(
"İş tamamlanamadı: " +
error.message,
"error"
);

return;

}


await loadOrders(
false
);


toast(
"İş tamamlandı ✓"
);

}

);

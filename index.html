<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7657e8">
<title>BAKSANA İşletme</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --purple:#7657e8;
  --purple2:#6242d8;
  --light:#f5f3fb;
  --border:#e9e6f0;
  --text:#191720;
  --muted:#77727f;
  --green:#23905a;
  --red:#c84444;
  --orange:#c47a00;
  --blue:#3e73d8;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--text);
}

button,
input,
select,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}


/* =========================
LOGIN
========================= */

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top right,#ebe4ff,transparent 35%),
    #f8f7fc;
}

.login-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:28px;
  padding:35px 30px;
  box-shadow:0 20px 60px rgba(40,20,100,.1);
}

.logo{
  width:175px;
  display:block;
  margin:0 auto 25px;
}

.login h1{
  text-align:center;
  font-size:25px;
  margin-bottom:8px;
}

.login p{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:28px;
}

.input{
  margin-bottom:15px;
}

.input label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.input input{
  width:100%;
  height:52px;
  border:1px solid var(--border);
  border-radius:13px;
  padding:0 14px;
  outline:none;
  background:#fff;
}

.input input:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 4px #7657e815;
}

.login-btn{
  width:100%;
  height:53px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#8065ef,#6242d8);
  color:#fff;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  margin-top:5px;
}

.login-btn.loading{
  pointer-events:none;
}

.error{
  display:none;
  background:#fff0f0;
  border:1px solid #ffd5d5;
  color:var(--red);
  padding:11px;
  border-radius:11px;
  font-size:13px;
  margin-bottom:15px;
  text-align:center;
}


/* =========================
PANEL
========================= */

.panel{
  display:none;
  min-height:100vh;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:245px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:25px 15px;
  z-index:20;
}

.sidebar .logo{
  width:145px;
  margin:0 12px 35px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.menu button{
  border:0;
  background:none;
  text-align:left;
  padding:13px;
  border-radius:13px;
  font-weight:700;
  font-size:14px;
  color:#625e6a;
  cursor:pointer;
}

.menu button:hover,
.menu button.active{
  background:#f0ebff;
  color:var(--purple2);
}

.logout{
  position:absolute;
  bottom:25px;
  left:15px;
  right:15px;
}

.main{
  margin-left:245px;
  padding:28px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  gap:20px;
}

.top h1{
  font-size:27px;
  margin-bottom:5px;
}

.top p{
  font-size:14px;
  color:var(--muted);
}

.business{
  background:#fff;
  border:1px solid var(--border);
  padding:8px 13px;
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  font-weight:700;
  flex-shrink:0;
}

.avatar{
  width:37px;
  height:37px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#8065ef,#6242d8);
  color:#fff;
}


/* =========================
STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.stat{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  min-width:0;
}

.stat-icon{
  font-size:22px;
}

.stat-number{
  font-size:27px;
  font-weight:900;
  margin-top:9px;
}

.stat-label{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}


/* =========================
CONTENT
========================= */

.content{
  margin-top:20px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
}

.content-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:15px;
}

.content-head h2{
  font-size:18px;
}

.orders{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.order{
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  background:#fff;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.order-title{
  font-size:14px;
  font-weight:900;
}

.order-info{
  font-size:12px;
  color:var(--muted);
  line-height:1.8;
  margin-top:5px;
}

.order-note{
  margin-top:10px;
  padding:10px 12px;
  border-radius:11px;
  background:#faf9fd;
  border:1px solid var(--border);
  font-size:12px;
  line-height:1.6;
}

.order-price{
  margin-top:9px;
  font-size:16px;
  font-weight:900;
}

.badge{
  padding:6px 9px;
  border-radius:50px;
  font-size:11px;
  font-weight:700;
  height:max-content;
  white-space:nowrap;
  background:#fff3dd;
  color:#a86b00;
}

.badge.green{
  background:#e7f8ee;
  color:#208451;
}

.badge.red{
  background:#fff0f0;
  color:#c33e3e;
}

.badge.blue{
  background:#edf4ff;
  color:#2f62bd;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:13px;
  flex-wrap:wrap;
}

.actions button{
  border:0;
  padding:9px 13px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
}

.accept{
  background:var(--purple);
  color:#fff;
}

.reject{
  background:#f1eef5;
  color:#625e6a;
}

.complete{
  background:#238b56;
  color:#fff;
}

.refresh-btn{
  border:1px solid var(--border);
  background:#fff;
  color:#4f4a57;
  padding:9px 13px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
}

.refresh-btn:hover{
  background:#faf9fd;
}

.order-site{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  padding:5px 8px;
  border-radius:8px;
  background:#f3efff;
  color:#5b3ec9;
  font-size:11px;
  font-weight:700;
}


/* =========================
EMPTY / LOADING
========================= */

.empty{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
}

.loading-box{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
}

.spinner{
  width:16px;
  height:16px;
  border:2px solid #ddd;
  border-top-color:var(--purple);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================
PROFILE
========================= */

.profile-card{
  max-width:700px;
}

.profile-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:15px 0;
  border-bottom:1px solid var(--border);
  font-size:14px;
}

.profile-row:last-child{
  border:0;
}

.profile-row b{
  text-align:right;
  word-break:break-word;
}


/* =========================
TOAST
========================= */

.toast{
  position:fixed;
  right:24px;
  bottom:24px;
  z-index:1000;
  max-width:360px;
  background:#191720;
  color:#fff;
  padding:13px 16px;
  border-radius:13px;
  font-size:13px;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  background:#1f7b50;
}

.toast.error{
  background:#a72f2f;
}


/* =========================
MODAL
========================= */

.modal-backdrop{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(16,12,30,.45);
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.2);
  padding:20px;
}

.modal h3{
  font-size:18px;
  margin-bottom:6px;
}

.modal p{
  font-size:13px;
  color:var(--muted);
  margin-bottom:15px;
}

.modal select{
  width:100%;
  height:48px;
  border:1px solid var(--border);
  border-radius:11px;
  padding:0 11px;
  background:#fff;
  outline:none;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.modal-actions button{
  flex:1;
  border:0;
  border-radius:11px;
  padding:12px;
  font-weight:700;
}

.modal-cancel{
  background:#f1eef5;
  color:#5e5966;
}

.modal-confirm{
  background:var(--red);
  color:#fff;
}


/* =========================
MOBILE
========================= */

.bottom{
  display:none;
}

@media(max-width:850px){

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    padding:20px 15px 90px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .top h1{
    font-size:22px;
  }

  .business{
    font-size:0;
  }

  .content{
    padding:15px;
  }

  .bottom{
    display:flex;
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    background:#fff;
    border-top:1px solid var(--border);
    z-index:100;
    justify-content:space-around;
  }

  .bottom button{
    border:0;
    background:none;
    font-size:11px;
    color:var(--muted);
    font-weight:700;
    padding:5px 10px;
  }

  .bottom button span{
    display:block;
    font-size:20px;
    margin-bottom:3px;
  }
}

@media(max-width:520px){

  .top{
    align-items:flex-start;
  }

  .top h1{
    font-size:20px;
  }

  .order-top{
    align-items:flex-start;
  }

  .profile-row{
    flex-direction:column;
    gap:6px;
  }

  .profile-row b{
    text-align:left;
  }

  .login-box{
    padding:28px 20px;
  }

  .toast{
    left:15px;
    right:15px;
    bottom:82px;
    max-width:none;
  }
}
</style>
</head>

/* =====================================================
HTML ESCAPE
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
PARA FORMAT
===================================================== */

function money(value){

  const n =
    Number(value || 0);

  return n.toLocaleString(
    "tr-TR",
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  ) + " ₺";

}


/* =====================================================
TARİH
===================================================== */

function formatDate(value){

  if(!value)
    return "-";

  try{

    return new Intl.DateTimeFormat(
      "tr-TR",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    ).format(
      new Date(value)
    );

  }

  catch{

    return String(value);

  }

}


/* =====================================================
BUTTON LOADING
===================================================== */

function setLoading(
  button,
  loading,
  label
){

  if(!button)
    return;

  button.disabled =
    loading;

  button.innerHTML =
    loading
      ?
      '<span class="spinner"></span>İşleniyor...'
      :
      label;

}

/* =====================================================
INIT
===================================================== */

async function init(){

  const {
    data,
    error
  } =
  await supabaseClient
    .auth
    .getSession();


  if(error){

    console.error(error);

    showLogin();

    return;

  }


  currentSession =
    data.session;


  if(currentSession){

    await loadBusiness();

  }

  else{

    showLogin();

  }

}


/* =====================================================
USER -> PROFILE -> BUSINESS
===================================================== */

async function loadBusiness(){

  try{

    if(
      !currentSession?.user?.id
    ){

      showLogin();

      return;

    }


    /* PROFILE */

    const {
      data:profileData,
      error:profileError
    } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,role,business_id,full_name"
      )
      .eq(
        "id",
        currentSession.user.id
      )
      .maybeSingle();


    if(profileError)
      throw profileError;


    if(
      !profileData ||
      profileData.role !== "business" ||
      !profileData.business_id
    ){

      showLogin();

      showToast(
        "Bu hesap bir işletme hesabına bağlı değil.",
        "error"
      );

      await supabaseClient
        .auth
        .signOut();

      return;

    }


    profile =
      profileData;


    /* BUSINESS */

    const {
      data:businessData,
      error:businessError
    } =
    await supabaseClient
      .from("businesses")
      .select(
        "id,name,phone,email,category,active,created_at"
      )
      .eq(
        "id",
        profile.business_id
      )
      .maybeSingle();


    if(businessError)
      throw businessError;


    if(
      !businessData ||
      !businessData.active
    ){

      showLogin();

      showToast(
        "İşletme hesabı aktif değil.",
        "error"
      );

      await supabaseClient
        .auth
        .signOut();

      return;

    }


    business =
      businessData;


    document
      .getElementById("businessName")
      .textContent =
      business.name;


    showPanel();


    showPageByName(
      "home"
    );


    await loadOrders();


    setupRealtime();


    startPolling();

  }

  catch(error){

    console.error(error);

    showLogin();

    showToast(
      "İşletme bilgileri yüklenemedi.",
      "error"
    );

  }

}


/* =====================================================
ORDERS
===================================================== */

async function loadOrders(
  showRefreshToast=false
){

  if(!business?.id)
    return;


  /*
    Önce ilişkili site bilgisiyle çekiyoruz.
  */

  const {
    data,
    error
  } =
  await supabaseClient
    .from("orders")
    .select(`
      id,
      service,
      customer_name,
      phone,
      block,
      apartment,
      service_date,
      service_time,
      details,
      note,
      status,
      created_at,
      site_id,
      business_id,
      order_code,
      price,
      rejection_reason,
      accepted_at,
      rejected_at,
      completed_at,
      sites(name,slug)
    `)
    .eq(
      "business_id",
      business.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);


    /*
      Eski DB yapısına karşı
      fallback.
    */

    const fallback =
      await supabaseClient
        .from("orders")
        .select("*")
        .eq(
          "business_id",
          business.id
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(fallback.error){

      console.error(
        fallback.error
      );

      showToast(
        "Siparişler yüklenemedi. Veritabanı bağlantısını kontrol edin.",
        "error"
      );

      return;

    }


    orders =
      fallback.data || [];

  }

  else{

    orders =
      data || [];

  }


  renderHome();


  const dynamic =
    document.getElementById(
      "dynamicPage"
    );


  if(
    dynamic.style.display !==
    "none"
  ){

    const activeButton =
      document.querySelector(
        ".menu button.active"
      );


    const page =
      activeButton?.dataset.page ||
      "home";


    if(page !== "home"){

      renderPage(page);

    }

  }


  if(showRefreshToast){

    showToast(
      "Siparişler güncellendi."
    );

  }

}


/* =====================================================
REALTIME
===================================================== */

function setupRealtime(){

  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "business-orders-" +
        business.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"orders",
          filter:
            "business_id=eq." +
            business.id
        },
        async ()=>{

          await loadOrders(
            false
          );

        }
      )
      .subscribe(
        (status)=>{

          if(
            status ===
            "CHANNEL_ERROR"
          ){

            console.warn(
              "Realtime bağlantısı kurulamadı; otomatik yenileme kullanılacak."
            );

          }

        }
      );

}


/* =====================================================
POLLING
===================================================== */

function startPolling(){

  clearInterval(
    pollTimer
  );


  pollTimer =
    setInterval(
      ()=>{
        loadOrders(false);
      },
      20000
    );

}


/* =====================================================
HOME
===================================================== */

function renderHome(){

  const pending =
    orders.filter(
      o =>
        o.status ===
        "Beklemede"
    );


  const ongoing =
    orders.filter(
      o =>
        o.status ===
          "Kabul Edildi" ||
        o.status ===
          "Devam Ediyor"
    );


  const completed =
    orders.filter(
      o =>
        o.status ===
        "Tamamlandı"
    );


  const earnings =
    completed.reduce(
      (
        sum,
        o
      ) =>
        sum +
        Number(
          o.price || 0
        ),
      0
    );


  document
    .getElementById(
      "pendingStat"
    )
    .textContent =
    pending.length;


  document
    .getElementById(
      "ongoingStat"
    )
    .textContent =
    ongoing.length;


  document
    .getElementById(
      "completedStat"
    )
    .textContent =
    completed.length;


  document
    .getElementById(
      "earningStat"
    )
    .textContent =
    money(
      earnings
    );


  const container =
    document.getElementById(
      "homeOrders"
    );


  if(!orders.length){

    container.innerHTML =
      emptyHTML(
        "📦",
        "Henüz size atanmış sipariş yok."
      );

    return;

  }


  container.innerHTML =
    orders
      .slice(0,5)
      .map(
        orderHTML
      )
      .join("");

}

/* =====================================================
SHOW PAGE
===================================================== */

function showPageByName(
  page
){

  const active =
    document.querySelector(
      `.menu button[data-page="${page}"]`
    );


  document
    .querySelectorAll(
      ".menu button[data-page]"
    )
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );


  if(active){

    active.classList.add(
      "active"
    );

  }


  document
    .querySelectorAll(
      ".bottom button"
    )
    .forEach(
      b=>{

        b.style.color =
          b.dataset.page ===
          page
            ?
            "var(--purple2)"
            :
            "var(--muted)";

      }
    );


  const home =
    document.getElementById(
      "homePage"
    );


  const dynamic =
    document.getElementById(
      "dynamicPage"
    );


  home.style.display =
    page === "home"
      ?
      "block"
      :
      "none";


  dynamic.style.display =
    page === "home"
      ?
      "none"
      :
      "block";


  document
    .getElementById(
      "pageTitle"
    )
    .textContent =
    PAGE_TITLES[page]?.[0] ||
    "BAKSANA";


  document
    .getElementById(
      "pageSubtitle"
    )
    .textContent =

  if(
    page !== "home"
  ){

    renderPage(
      page
    );

  }

}

                  :
                    "var(--red)"
              };
            "
          >

            ${
              business?.active
                ?
                  "Aktif"
                :
                  "Pasif"
            }

          </b>

        </div>


        <div class="profile-row">

          <span>
            Hesap oluşturulma
          </span>

          <b>

            ${esc(
              formatDate(
                business?.created_at
              )
            )}

          </b>

        </div>


      </div>

    `;

  }

}


/* =====================================================
ACCEPT ORDER
===================================================== */

async function acceptOrder(
  id
){

  if(
    !business?.id
  )
    return;


  const button =
    event?.currentTarget;


  setLoading(
    button,
    true,
    "Kabul Et"
  );


  const {
    data,
    error
  } =
  await supabaseClient
    .from("orders")
    .update({
      status:
        "Kabul Edildi",

      accepted_at:
        new Date()
          .toISOString()
    })
    .eq(
      "id",
      id
    )
    .eq(
      "business_id",
      business.id
    )
    .select(
      "id,status,accepted_at"
    )
    .maybeSingle();


  if(
    error ||
    !data
  ){

    console.error(
      error
    );

    showToast(
      "Sipariş kabul edilemedi.",
      "error"
    );

    await loadOrders(
      false
    );

    return;

  }


  await loadOrders(
    false
  );


  showToast(
    "Sipariş kabul edildi ✓"
  );

}


/* =====================================================
OPEN REJECT MODAL
===================================================== */

function openRejectModal(
  id
){

  rejectOrderId =
    id;


  document
    .getElementById(
      "rejectReason"
    )
    .value =
    "";


  document
    .getElementById(
      "rejectModal"
    )
    .classList
    .add(
      "show"
    );

}


/* =====================================================
CLOSE MODAL
===================================================== */

function closeRejectModal(){

  rejectOrderId =
    null;


  document
    .getElementById(
      "rejectModal"
    )
    .classList
    .remove(
      "show"
    );

}


/* =====================================================
CONFIRM REJECT
===================================================== */

async function confirmReject(){

  if(
    !rejectOrderId ||
    !business?.id
  )
    return;


  const reason =
    document
      .getElementById(
        "rejectReason"
      )
      .value;


  if(!reason){

    showToast(
      "Lütfen bir red nedeni seç.",
      "error"
    );

    return;

  }


  const button =
    document
      .getElementById(
        "confirmRejectBtn"
      );


  setLoading(
    button,
    true,
    "Siparişi Reddet"
  );


  const {
    data,
    error
  } =
  await supabaseClient
    .from("orders")
    .update({

      status:
        "Reddedildi",

      rejection_reason:
        reason,

      rejected_at:
        new Date()
          .toISOString()

    })
    .eq(
      "id",
      rejectOrderId
    )
    .eq(
      "business_id",
      business.id
    )
    .select(
      "id,status,rejection_reason,rejected_at"
    )
    .maybeSingle();


  setLoading(
    button,
    false,
    "Siparişi Reddet"
  );


  if(
    error ||
    !data
  ){

    console.error(
      error
    );

    showToast(
      "Sipariş reddedilemedi.",
      "error"
    );

    return;

  }


  closeRejectModal();


  await loadOrders(
    false
  );


  showToast(
    "Sipariş reddedildi."
  );

}
